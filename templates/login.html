{% extends "base.html" %}
{% block title %}Log in · Vocab Builder{% endblock %}
{% block content %}
<div class="auth-page" style="margin:-72px -34px -28px;min-height:calc(100vh + 100px)">
  <div class="auth-shell">
    <div class="auth-logo"><span class="brand-mark">V</span> Vocab Builder</div>
    <h1>Welcome back</h1>
    <p class="lead">Continue your daily vocabulary practice.</p>
    <form method="POST" class="auth-form">
      <div><label>Email address</label><input type="email" name="username" placeholder="you@example.com" autocomplete="email" required></div>
      <div><label>Password</label><input type="password" name="password" placeholder="Your password" autocomplete="current-password" required></div>
      <button class="button" type="submit">Log in</button>
    </form>
    <div class="auth-foot">New to Vocab Builder? <a href="{{ url_for('signup') }}">Create an account</a></div>
  </div>
</div>
{% endblock %}
